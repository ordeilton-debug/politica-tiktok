    <h1>Política de Privacidade</h1>
    <p>O aplicativo "Desenhos do Pistola" coleta apenas os dados necessários para a autenticação do usuário e para o envio de vídeos para a conta do próprio desenvolvedor, conforme permitido pela API do TikTok.</p>
    <p>Nenhum dado é compartilhado com terceiros.</p>
